<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#162d42"><title>Mes séances · A B C</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#18283a;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#162d42;color:white;padding:23px max(16px,calc((100vw - 960px)/2));}h1{margin:0 0 5px;font-size:1.5rem}header p{margin:0;color:#d0dbe5;font-size:.89rem}main{max-width:960px;margin:auto;padding:16px 16px 70px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button,.btn{font:inherit;cursor:pointer;border:1px solid #c5d0d9;background:white;border-radius:10px;padding:10px 13px;color:#18304b}button:hover{background:#eff6fa}button:disabled{opacity:.4;cursor:not-allowed}.nav button.active,.primary{background:#176c8a;color:white;border-color:#176c8a}.danger{color:#a42f35;border-color:#e7b5b8}.muted{color:#597082;font-size:.87rem}.card{background:#fff;border:1px solid #e0e7ed;border-radius:15px;padding:17px;margin-bottom:13px;box-shadow:0 2px 8px #122c4108}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}h2{font-size:1.18rem;margin:0 0 12px}h3{font-size:1rem;margin:0 0 7px}.pill{font-size:.76rem;background:#e7f1f6;border-radius:20px;padding:4px 9px;white-space:nowrap}.alert{background:#fff6df;border-left:4px solid #d69b29;padding:12px 14px;border-radius:8px;font-size:.88rem;margin-bottom:14px}.exercise{border-top:1px solid #e5ebef;padding:15px 0}.exercise:first-child{border-top:0}input,select,textarea{font:inherit;color:inherit;border:1px solid #bfcdd7;border-radius:9px;padding:9px;background:white;max-width:100%;width:100%}label{font-size:.8rem;color:#4f6675;display:block;margin-bottom:4px}.field{min-width:90px;flex:1}.setrow{display:grid;grid-template-columns:38px 1fr 1fr 39px;align-items:end;gap:8px;margin:8px 0}.setrow.time,.setrow.reps{grid-template-columns:38px 1fr 39px}.setrow .num{padding-bottom:10px;text-align:center;color:#526877}.tiny{padding:8px 10px}.sets{margin-top:10px}.details{font-size:.85rem;color:#516779}.details summary{cursor:pointer}small{font-size:.78rem}.stat{font-size:1.45rem;font-weight:750;color:#176c8a}#view{min-height:280px}.hidden{display:none}.right{text-align:right}.session-banner{border-left:4px solid #176c8a}.week{background:#e9f3f6;padding:10px 13px;border-radius:9px;font-size:.85rem}.chart{width:100%;height:185px;display:block}.hr{height:1px;background:#e5ebef;margin:14px 0}.session-name{font-weight:700}.note{font-size:.85rem;color:#566c7e}.tag{background:#f0f4f7;padding:3px 7px;border-radius:5px;font-size:.77rem}.footer{margin-top:30px;text-align:center;font-size:.78rem;color:#5c7182}@media(max-width:450px){.card{padding:13px}.setrow{gap:5px}.nav button{flex:1;padding:10px 7px;font-size:.85rem}}
</style></head><body><header><h1>Mon carnet de salle</h1><p>Parcours A · B · C — progression à mon rythme</p></header><main><div class="nav" id="nav"><button data-view="home" class="active">Accueil</button><button data-view="session">Séance</button><button data-view="program">Programme</button><button data-view="history">Historique</button><button data-view="progress">Progression</button><button data-view="cloud">Synchronisation</button><button data-view="backup">Sauvegarde</button></div><div id="sync-status" aria-live="polite" class="week" style="margin-bottom:12px">Enregistrement automatique sur cet appareil · Synchronisation non configurée</div><div id="view"></div><p class="footer">Enregistrement automatique sur cet appareil. La synchronisation entre appareils nécessite la connexion à un espace personnel.</p></main>
<script>
'use strict';
const KEY='mon_carnet_abc_v1';
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const X=(name,target,mode='weight',note='',rest='')=>({id:uid(),name,target,mode,note,rest});
const defaultPrograms={
 A:[X('Échauffement : vélo / elliptique / marche','8 min, léger','time','Choisir un appareil bien toléré. Arrêter si l’orteil fait mal.'),X('Presse à cuisses','3 × 10–12','weight','Dos et bassin plaqués ; pieds à plat ; ne pas verrouiller les genoux.','90 s'),X('Développé couché machine','3 × 8–10 (+ échauffement)','weight','À faire valider par le kiné pour l’épaule, les cervicales et l’omoplate gauche.','90 s'),X('Rowing assis poitrine appuyée','3 × 10–12','weight','Poitrine contre coussin, démarrer léger. À faire valider par le kiné.','75 s'),X('Dead bug','3 × 8 par côté','reps','Bas du dos plaqué au sol ; mouvement lent.'),X('Planche avant-bras','2–3 × 30–60 s','time','Sur les genoux si douleur à l’orteil ; arrêter si épaule/cou/dos gênent.'),X('Planche latérale','2 × 20–30 s par côté','time','Genoux pliés si nécessaire. Pas de douleur à l’épaule gauche.')],
 B:[X('Échauffement : vélo / elliptique / marche','8 min, léger','time','Éviter les appuis douloureux.'),X('Pont fessier au sol','3 × 10–12','reps','Sans charge initialement, appui talons. À valider par le kiné.','60 s'),X('Leg curl (assis ou allongé)','3 × 10–12','weight','Contrôler la descente ; charge non comparable entre machines.','75 s'),X('Tirage vertical poulie haute','3 × 10–12','weight','Sans balancier ; à faire valider pour épaule/omoplate.','75 s'),X('Développé incliné haltères / machine','3 × 8–12','weight','Banc ≈ 30° ; à faire valider par le kiné.','90 s'),X('Élévations latérales','2 × 12–15','weight','Charge légère ; arrêter si épaule/cou/omoplate gênent.','60 s'),X('Curl biceps haltères','2 × 12','weight','Assis si préférable pour le dos ; à faire valider.','60 s'),X('Extension triceps à la poulie','2 × 12','weight','Buste droit ; à faire valider.','60 s'),X('Pallof press','3 × 10 par côté','weight','Résister à la rotation ; pieds à plat.'),X('Bird dog','2 × 8 par côté','reps','Bassin stable ; passer si l’orteil fait mal.')],
 C:[X('Hip thrust / pont fessier lesté','3 × 10–12','weight','Appui sur les talons ; pas de cambrure.','90 s'),X('Presse à cuisses pieds hauts et écartés','3 × 12–15','weight','Charge plus légère que pour A, pieds à plat.','75 s'),X('Rowing poitrine appuyée','3 × 12','weight','Retour contrôlé. À faire valider par le kiné.','75 s'),X('Pompes inclinées OU pec deck','3 × 10–15','reps','Choisir un seul exercice ; préférer pec deck si orteil ou épaule gênent. À faire valider.','60 s'),X('Cardio : marche inclinée / vélo','10–20 min, facile à modéré','time','Adapter aux réactions du dos, de la jambe et de l’orteil.'),X('Planche latérale','3 × 20–30 s par côté','time','Genoux pliés si besoin ; éviter l’appui douloureux à l’épaule.')]
};
function initial(){return {version:1,programs:defaultPrograms,sessions:[],draft:null};}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!db.programs||!Array.isArray(db.sessions))throw Error();}catch{db=initial();alert('Données locales illisibles : une base vierge a été ouverte. Réimportez une sauvegarde si vous en avez une.');}
let current='home',selected='A';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=d=>new Date(/^\d{4}-\d{2}-\d{2}$/.test(d)?d+'T12:00:00':d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const todayLocal=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');};
const sessionDate=s=>s.date||s.finishedAt;
const safeVideo=url=>{try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:null;}catch{return null;}};
function editDraftDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||Number.isNaN(new Date(v+'T12:00:00').getTime()))return;db.draft.date=v;save();}
let cloudCfg=JSON.parse(localStorage.getItem('abc_cloud_cfg')||'null');
let auth=JSON.parse(localStorage.getItem('abc_cloud_auth')||'null');
let syncTimer=null,syncBusy=false,syncQueued=false,localRevision=0;
function statusSync(message){const el=document.getElementById('sync-status');if(el)el.textContent=message;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));localRevision++;statusSync(auth?.access_token?'Enregistré sur cet appareil · En attente de synchronisation…':'Enregistré automatiquement sur cet appareil · Aucun compte connecté');if(auth?.access_token){clearTimeout(syncTimer);syncTimer=setTimeout(uploadCloud,1100);}return true;}catch(e){alert('Impossible d’enregistrer sur cet appareil. Vérifiez l’espace disponible.');return false;}}
const cloudHeaders=()=>({'apikey':cloudCfg.key,'Authorization':'Bearer '+auth.access_token,'Content-Type':'application/json'});
async function cloudFetch(url,options={}){let r=await fetch(cloudCfg.url.replace(/\/$/,'')+url,options);let body=await r.text();let x;try{x=body?JSON.parse(body):null;}catch{x={message:body};}if(!r.ok)throw new Error(x?.msg||x?.message||x?.error_description||x?.error||('Erreur HTTP '+r.status));return x;}
async function refreshAuth(){if(!auth?.refresh_token||!cloudCfg)return false;try{let x=await cloudFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':cloudCfg.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:auth.refresh_token})});auth=x;localStorage.setItem('abc_cloud_auth',JSON.stringify(auth));return true;}catch{return false;}}
async function loginCloud(){let email=document.getElementById('cloud-email').value.trim(),password=document.getElementById('cloud-password').value;if(!cloudCfg){alert('Configurez d’abord votre espace Supabase.');return;}if(!email||!password){alert('Saisissez votre email et votre mot de passe.');return;}try{let x=await cloudFetch('/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':cloudCfg.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});auth=x;localStorage.setItem('abc_cloud_auth',JSON.stringify(auth));await loadCloud();go('cloud');}catch(e){alert('Connexion impossible : '+e.message);}}
async function signupCloud(){let email=document.getElementById('cloud-email').value.trim(),password=document.getElementById('cloud-password').value;if(!cloudCfg||!email||password.length<8){alert('Configurez Supabase et saisissez un email et un mot de passe de 8 caractères minimum.');return;}try{await cloudFetch('/auth/v1/signup',{method:'POST',headers:{'apikey':cloudCfg.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});alert('Compte demandé. Vérifiez votre email si une confirmation est exigée, puis cliquez sur Se connecter.');}catch(e){alert('Création impossible : '+e.message);}}
function setCloudCfg(){let url=document.getElementById('cloud-url').value.trim(),key=document.getElementById('cloud-key').value.trim();try{let u=new URL(url);if(u.protocol!=='https:'||!key)throw Error();}catch{alert('Veuillez fournir une URL https et une clé publique valides.');return;}cloudCfg={url,key};localStorage.setItem('abc_cloud_cfg',JSON.stringify(cloudCfg));auth=null;localStorage.removeItem('abc_cloud_auth');go('cloud');}
function logoutCloud(){auth=null;localStorage.removeItem('abc_cloud_auth');statusSync('Données locales conservées · Compte déconnecté');go('cloud');}
async function cloudRead(){let x=await cloudFetch('/rest/v1/workout_data?select=data,updated_at&user_id=eq.'+encodeURIComponent(auth.user.id),{headers:cloudHeaders()});return x[0]||null;}
async function loadCloud(){if(!auth?.access_token||!cloudCfg)return;try{if(auth.expires_at && Date.now()/1000>auth.expires_at-60)await refreshAuth();let entry=await cloudRead();if(entry){if(db.sessions.length||db.draft){if(!confirm('Des données existent sur cet appareil et dans votre compte. Charger les données du compte ? Annuler conserve les données locales et ne remplace pas la sauvegarde en ligne.')){statusSync('Conflit : choisissez les données à conserver dans Synchronisation');return;}}db=entry.data;localStorage.setItem(KEY,JSON.stringify(db));statusSync('Données chargées depuis votre compte · Synchronisation active');render();}else{statusSync('Compte connecté · Première synchronisation en cours');await uploadCloud();}}catch(e){statusSync('Connexion au compte impossible : '+e.message);}}
async function uploadCloud(){if(!auth?.access_token||!cloudCfg)return;if(syncBusy){syncQueued=true;return;}syncBusy=true;let rev=localRevision;try{if(auth.expires_at && Date.now()/1000>auth.expires_at-60){if(!await refreshAuth())throw Error('session expirée : reconnectez-vous');}await cloudFetch('/rest/v1/workout_data?on_conflict=user_id',{method:'POST',headers:{...cloudHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:auth.user.id,data:db})});statusSync('Enregistré sur cet appareil et synchronisé en ligne ✓');}catch(e){statusSync('Enregistré sur cet appareil, mais synchronisation en échec : '+e.message);}finally{syncBusy=false;if(syncQueued||rev!==localRevision){syncQueued=false;clearTimeout(syncTimer);syncTimer=setTimeout(uploadCloud,1300);}}}
function cloud(){return `<div class="card"><h2>Synchronisation automatique</h2><p>Une fois connecté à votre compte personnel, vos séances sont enregistrées sur cet appareil et synchronisées en ligne. La connexion internet est nécessaire pour synchroniser.</p>${!cloudCfg?'<p class="alert">Il faut d’abord créer un projet gratuit Supabase et exécuter le script SQL fourni avec cette application. Ses paramètres ne sont pas encore renseignés.</p>':''}<p class="muted">Cette fonctionnalité est optionnelle : sans compte, le carnet conserve automatiquement les séances dans ce navigateur uniquement.</p></div><div class="card"><h3>1. Paramètres de stockage</h3><label>URL du projet Supabase</label><input id="cloud-url" placeholder="https://...supabase.co" value="${esc(cloudCfg?.url||'')}"><label style="margin-top:8px">Clé publique (anon/publishable), jamais une clé secrète</label><input id="cloud-key" placeholder="sb_publishable_..." value="${esc(cloudCfg?.key||'')}"><button style="margin-top:10px" onclick="setCloudCfg()">Enregistrer les paramètres</button></div><div class="card"><h3>2. Mon compte</h3>${auth?.user?`<p>Connecté : <b>${esc(auth.user.email||'Compte personnel')}</b></p><div class="actions"><button class="primary" onclick="uploadCloud()">Synchroniser maintenant</button><button onclick="loadCloud()">Récupérer les données du compte</button><button onclick="logoutCloud()">Se déconnecter</button></div>`:`<label>Email</label><input id="cloud-email" type="email" autocomplete="email"><label style="margin-top:8px">Mot de passe</label><input id="cloud-password" type="password" autocomplete="current-password"><div class="actions" style="margin-top:12px"><button class="primary" onclick="loginCloud()">Se connecter</button><button onclick="signupCloud()">Créer un compte</button></div>`}</div><div class="alert">Important : une connexion initiale sur un nouvel appareil charge les données du compte. Évitez d’utiliser simultanément deux appareils pendant une séance : cette première version ne fusionne pas les modifications concurrentes.</div>`;}

function go(page){current=page;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===page));render();window.scrollTo(0,0);}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)go(b.dataset.view);});
function lastEx(ex){for(let i=db.sessions.length-1;i>=0;i--){const found=db.sessions[i].entries.find(z=>z.exerciseId===ex.id);if(found)return found;}return null;}
function countFromTarget(t){let m=t.match(/(\d+)\s*[×x]/);return m?Math.min(Number(m[1]),8):1;}
function newDraft(path){if(db.draft&&!confirm('Remplacer la séance en cours ? Les saisies non terminées seront perdues.'))return;db.draft={id:uid(),path,startedAt:new Date().toISOString(),date:todayLocal(),notes:'',entries:db.programs[path].map(ex=>{let last=lastEx(ex),n=countFromTarget(ex.target);return {exerciseId:ex.id,name:ex.name,mode:ex.mode,target:ex.target,rest:ex.rest,note:ex.note,video:ex.video||'',skipped:false,sets:Array.from({length:n},(_,i)=>({value:last?.sets[i]?.value??'',reps:last?.sets[i]?.reps??''}))};})};save();go('session');}
function render(){const el=document.getElementById('view');el.innerHTML=({home:home,session:session,program:program,history:history,progress:progress,cloud:cloud,backup:backup}[current])();}
function home(){let last=db.sessions.at(-1);return `<div class="alert"><b>Sécurité :</b> ce programme doit être adapté avec votre kiné. Arrêter en cas de douleur irradiant dans la fesse/jambe ou de gêne à l’épaule, au cou ou à l’orteil. Ne jamais augmenter la charge sur la seule recommandation de l’application.</div><div class="grid"><div class="card"><div class="muted">Séances enregistrées</div><div class="stat">${db.sessions.length}</div></div><div class="card"><div class="muted">Dernière séance</div><div class="stat">${last?esc(last.path):'—'}</div><small>${last?fdate(sessionDate(last)):'Aucune pour le moment'}</small></div></div><div class="card"><h2>Commencer un entraînement</h2><p class="muted">A et B : parcours principaux, à alterner ; C : séance optionnelle. Aucun calendrier imposé.</p><div class="grid">${['A','B','C'].map(p=>`<button class="primary" onclick="newDraft('${p}')">Démarrer ${p} <small>(${db.programs[p].length} exercices)</small></button>`).join('')}</div>${db.draft?`<p><button onclick="go('session')">↪ Reprendre ma séance ${esc(db.draft.path)}</button></p>`:''}</div><div class="card"><h2>Comment progresser ?</h2><p>Conserver environ deux répétitions en réserve. Envisager une petite hausse de charge uniquement lorsque toutes les séries atteignent le haut de la fourchette avec technique contrôlée et sans douleur, selon la validation de votre kiné.</p><p class="muted">Une semaine plus légère toutes les 4 à 6 semaines était prévue dans votre programme. L’application ne modifie pas automatiquement vos charges.</p></div>`;}
function session(){let d=db.draft;if(!d)return `<div class="card"><h2>Pas de séance en cours</h2><p>Choisissez un parcours depuis l’accueil.</p><button onclick="go('home')">Retour à l’accueil</button></div>`;return `<div class="card session-banner"><div class="row"><div><h2>Séance ${esc(d.path)}</h2><div class="muted"><label for="session-date">Date de la séance (modifiable, y compris dans le passé)</label><input id="session-date" type="date" value="${esc(d.date||todayLocal())}" onchange="editDraftDate(this.value)"></div></div><div class="actions"><button onclick="discardDraft()" class="danger">Abandonner</button><button class="primary" onclick="finish()">Terminer et enregistrer</button></div></div></div><div class="alert">Les valeurs reprises de la dernière séance sont des <b>repères à confirmer</b>, pas des performances enregistrées. Modifiez-les pour refléter votre séance réelle. Cochez « non réalisé » si besoin.</div>${d.entries.map((e,i)=>{const ex=db.programs[d.path].find(z=>z.id===e.exerciseId);const last=ex?lastEx(ex):null;return `<div class="card"><div class="row"><h3>${i+1}. ${esc(e.name)}</h3><span class="pill">${esc(e.target)}</span></div><p class="details">${esc(e.note||'')}${e.rest?' · Repos '+esc(e.rest):''}</p>${safeVideo(e.video)?`<p><a href="${esc(safeVideo(e.video))}" target="_blank" rel="noopener noreferrer">▶ Voir la vidéo de démonstration ↗</a></p>`:''}${last?`<p class="muted">Dernière fois : ${last.sets.map(s=>e.mode==='time'?esc(s.value)+' s':e.mode==='reps'?esc(s.value)+' rép.':esc(s.value)+' kg × '+esc(s.reps)).join(' · ')}</p>`:''}<label><input type="checkbox" style="width:auto" ${e.skipped?'checked':''} onchange="updateEntry(${i},'skipped',this.checked)"> Exercice non réalisé</label><div ${e.skipped?'style="opacity:.45"':''}><div class="sets">${e.sets.map((s,j)=>`<div class="setrow ${e.mode==='time'||e.mode==='reps'?'time':''}"><div class="num">${j+1}</div><div><label>${e.mode==='time'?'Secondes':e.mode==='reps'?'Répétitions':'Charge (kg)'}</label><input ${e.skipped?'disabled':''} inputmode="decimal" type="number" min="0" step="any" value="${esc(s.value)}" oninput="updateSet(${i},${j},'value',this.value)"></div>${e.mode==='time'||e.mode==='reps'?'':`<div><label>Répétitions</label><input ${e.skipped?'disabled':''} inputmode="numeric" type="number" min="0" step="1" value="${esc(s.reps)}" oninput="updateSet(${i},${j},'reps',this.value)"></div>`}<button class="tiny danger" ${e.skipped?'disabled':''} title="Enlever cette série" onclick="removeSet(${i},${j})">×</button></div>`).join('')}</div><button class="tiny" ${e.skipped?'disabled':''} onclick="addSet(${i})">+ Ajouter une série</button></div></div>`;}).join('')}<div class="card"><label for="sessionnotes">Notes sur la séance (ressenti, douleur, machine utilisée…)</label><textarea id="sessionnotes" rows="3" oninput="db.draft.notes=this.value;save()">${esc(d.notes)}</textarea><button class="primary" style="margin-top:12px;width:100%" onclick="finish()">Terminer et enregistrer la séance</button></div>`;}
function updateEntry(i,k,v){db.draft.entries[i][k]=v;save();if(k==='skipped')render();}
function updateSet(i,j,k,v){db.draft.entries[i].sets[j][k]=v;save();}
function addSet(i){db.draft.entries[i].sets.push({value:'',reps:''});save();render();}
function removeSet(i,j){db.draft.entries[i].sets.splice(j,1);save();render();}
function discardDraft(){if(confirm('Abandonner définitivement la séance en cours ?')){db.draft=null;save();go('home');}}
function finish(){let d=db.draft;if(!d)return;let used=d.entries.some(e=>!e.skipped&&e.sets.some(s=>s.value!==''||s.reps!==''));if(!used&&!confirm('Aucune valeur saisie. Enregistrer quand même ?'))return;if(!confirm('Enregistrer la séance '+d.path+' dans l’historique ?'))return;db.sessions.push({...d,finishedAt:new Date().toISOString()});db.draft=null;save();go('history');}
function program(){return `<div class="card"><h2>Modifier mes parcours</h2><p class="muted">Les modifications s’appliquent aux prochaines séances ; l’historique déjà enregistré ne change pas. Après une modification importante, validez le parcours avec votre kiné.</p><div class="actions">${['A','B','C'].map(x=>`<button class="${selected===x?'primary':''}" onclick="selected='${x}';render()">Parcours ${x}</button>`).join('')}</div></div><div class="card">${db.programs[selected].map((ex,i)=>`<div class="exercise"><div class="row"><h3>${i+1}. ${esc(ex.name)}</h3><div class="actions"><button class="tiny" onclick="moveEx(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="tiny" onclick="moveEx(${i},1)" ${i===db.programs[selected].length-1?'disabled':''}>↓</button><button class="tiny danger" onclick="deleteEx(${i})">Retirer</button></div></div><div class="grid"><div><label>Nom</label><input value="${esc(ex.name)}" onchange="editEx(${i},'name',this.value)"></div><div><label>Objectif (texte libre)</label><input value="${esc(ex.target)}" onchange="editEx(${i},'target',this.value)"></div><div><label>Type de suivi</label><select onchange="editEx(${i},'mode',this.value)"><option value="weight" ${ex.mode==='weight'?'selected':''}>Charge + répétitions</option><option value="reps" ${ex.mode==='reps'?'selected':''}>Répétitions</option><option value="time" ${ex.mode==='time'?'selected':''}>Durée (secondes)</option></select></div><div><label>Repos</label><input value="${esc(ex.rest)}" onchange="editEx(${i},'rest',this.value)"></div></div><label style="margin-top:8px">Lien vers une vidéo de démonstration (URL libre)</label><input type="url" placeholder="https://www.youtube.com/watch?v=..." value="${esc(ex.video||'')}" onchange="editEx(${i},'video',this.value)">${safeVideo(ex.video)?`<p><a target="_blank" rel="noopener noreferrer" href="${esc(safeVideo(ex.video))}">▶ Regarder la vidéo ↗</a></p>`:''}<label style="margin-top:8px">Consignes et précautions</label><textarea rows="2" onchange="editEx(${i},'note',this.value)">${esc(ex.note)}</textarea></div>`).join('')}<button class="primary" onclick="addEx()">+ Ajouter un exercice au parcours ${selected}</button></div>`;}
function editEx(i,k,v){db.programs[selected][i][k]=v;save();}
function moveEx(i,shift){let a=db.programs[selected];let j=i+shift;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render();}
function deleteEx(i){if(confirm('Retirer cet exercice du parcours '+selected+' ? (Historique conservé)')){db.programs[selected].splice(i,1);save();render();}}
function addEx(){let name=prompt('Nom du nouvel exercice :');if(!name?.trim())return;db.programs[selected].push(X(name.trim(),'3 × 10','weight','À valider selon vos contraintes.','60 s'));save();render();}
function history(){return `<div class="card"><h2>Historique (${db.sessions.length})</h2><p class="muted">Séances classées par date d'entraînement, même si vous les avez saisies après coup. Les modifications du programme ne changent pas l'historique.</p></div>${db.sessions.length?[...db.sessions].sort((a,b)=>String(sessionDate(b)).localeCompare(String(sessionDate(a)))).map(s=>`<details class="card"><summary><span class="session-name">Parcours ${esc(s.path)}</span> · ${fdate(sessionDate(s))} <span class="muted">· ${s.entries.filter(e=>!e.skipped).length} exercices</span></summary><div class="hr"></div>${s.entries.map(e=>`<p><b>${esc(e.name)}</b> ${e.skipped?'<span class="tag">non réalisé</span>':`<span class="muted">${e.sets.map(z=>e.mode==='time'?esc(z.value||'—')+' s':e.mode==='reps'?esc(z.value||'—')+' rép.':esc(z.value||'—')+' kg × '+esc(z.reps||'—')).join(' ; ')}</span>`}</p>`).join('')}${s.notes?`<p><i>Note : ${esc(s.notes)}</i></p>`:''}<button class="tiny danger" onclick="deleteSession('${s.id}')">Supprimer cette séance</button></details>`).join(''):'<div class="card">Aucune séance enregistrée pour le moment.</div>'}`;}
function deleteSession(id){if(confirm('Supprimer définitivement cette séance ?')){db.sessions=db.sessions.filter(s=>s.id!==id);save();render();}}
function progress(){let exercises=[...new Map(Object.values(db.programs).flat().map(ex=>[ex.id,ex])).values()];return `<div class="card"><h2>Progression par exercice</h2><p class="muted">Pour les exercices avec charge : meilleure charge de chaque séance (sans normalisation du nombre de répétitions). Pour les autres : maximum de répétitions ou de secondes. Comparer seulement les mêmes appareils et gestes.</p><label>Exercice</label><select id="chartEx" onchange="drawChart(this.value)"><option value="">Sélectionner un exercice</option>${exercises.map(ex=>`<option value="${ex.id}">${esc(ex.name)} (${esc(ex.mode)})</option>`).join('')}</select><div id="plot" style="margin-top:16px" class="muted">Sélectionnez un exercice pour voir ses résultats.</div></div>`;}
function drawChart(id){let box=document.getElementById('plot');let ex=Object.values(db.programs).flat().find(e=>e.id===id);if(!ex){box.textContent='';return;}let values=[...db.sessions].sort((a,b)=>String(sessionDate(a)).localeCompare(String(sessionDate(b)))).map(s=>{let e=s.entries.find(z=>z.exerciseId===id&&!z.skipped);if(!e)return null;let vals=e.sets.map(z=>Number(ex.mode==='reps'?z.value:z.value)).filter(v=>Number.isFinite(v)&&v>0);return vals.length?{label:fdate(sessionDate(s)),v:Math.max(...vals)}:null;}).filter(Boolean);if(!values.length){box.innerHTML='<p>Pas encore de données enregistrées pour cet exercice.</p>';return;}const max=Math.max(...values.map(x=>x.v)),w=650,h=190,pad=34,barW=Math.min(42,(w-pad*2)/values.length*.7),step=(w-pad*2)/values.length;let svg=`<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="Progression pour ${esc(ex.name)}"><line x1="${pad}" x2="${w-pad}" y1="${h-pad}" y2="${h-pad}" stroke="#aac1cd"/>${values.map((x,i)=>{let bh=x.v/max*125,px=pad+i*step+(step-barW)/2;return `<rect x="${px}" y="${h-pad-bh}" width="${barW}" height="${bh}" fill="#176c8a" rx="4"><title>${esc(x.label)} : ${x.v}</title></rect><text x="${px+barW/2}" y="${h-pad-bh-5}" text-anchor="middle" font-size="11" fill="#233d4e">${x.v}</text>`;}).join('')}</svg>`;box.innerHTML=svg+`<small>${values.length} séance(s) · unité : ${ex.mode==='weight'?'kg':ex.mode==='time'?'secondes':'répétitions'}. Les barres suivent l’ordre chronologique.</small><p class="muted">${values.map(x=>esc(x.label)+': '+x.v).join(' · ')}</p>`;}
function download(name,txt,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([txt],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportJSON(){download('sauvegarde_carnet_abc_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');}
function exportCSV(){let rows=[['date','parcours','exercice','statut','serie','charge_kg_ou_duree_s','repetitions','type','note_seance']];db.sessions.forEach(s=>s.entries.forEach(e=>e.sets.forEach((z,i)=>rows.push([sessionDate(s),s.path,e.name,e.skipped?'non realise':'realise',i+1,z.value,z.reps,e.mode,s.notes]))));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');download('historique_carnet_abc.csv',csv,'text/csv;charset=utf-8');}
function backup(){return `<div class="card"><h2>Sauvegarder vos données</h2><p>Vos séances sont stockées <b>sur cet appareil, dans ce navigateur</b>. Elles ne sont pas automatiquement synchronisées. Un effacement des données du navigateur peut les supprimer.</p><div class="actions"><button class="primary" onclick="exportJSON()">Télécharger la sauvegarde JSON</button><button onclick="exportCSV()">Exporter l’historique CSV</button></div><p class="muted">Le JSON conserve programme, séances et séance en cours ; le CSV sert à analyser les résultats dans Excel ou R.</p></div><div class="card"><h2>Restaurer une sauvegarde</h2><p class="muted">Une restauration remplace toutes les données présentes dans ce navigateur.</p><input type="file" id="importFile" accept=".json,application/json"><button style="margin-top:10px" onclick="importJSON()">Importer ce fichier JSON</button></div><div class="card"><h2>Protection des données</h2><p>Gardez une copie JSON après chaque semaine ou changement important d’appareil. Évitez d’utiliser une fenêtre privée. Cette version ne nécessite aucun compte ni serveur et n’envoie aucune donnée à un tiers.</p></div>`;}
async function importJSON(){const file=document.getElementById('importFile').files[0];if(!file){alert('Choisissez un fichier JSON.');return;}try{let x=JSON.parse(await file.text());if(!x||!x.programs||!['A','B','C'].every(p=>Array.isArray(x.programs[p]))||!Array.isArray(x.sessions))throw Error('Format incorrect');if(!confirm('Remplacer le programme et tout l’historique actuels par cette sauvegarde ?'))return;db=x;save();go('home');alert('Sauvegarde restaurée.');}catch(e){alert('Impossible d’importer ce fichier : '+e.message);}}
render();if(auth?.access_token&&cloudCfg){loadCloud();}else{statusSync('Enregistré automatiquement sur cet appareil · Synchronisation non activée');}
</script></body></html>
